name: Tilawat Browser Smoke

on:
  workflow_run:
    workflows: ["Deploy Tilawat to Cloudflare Pages"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: tilawat-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Test production startup
        run: |
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors=[];
          page.on('console', msg => { if(msg.type()==='error') errors.push('console: '+msg.text()); });
          page.on('pageerror', err => errors.push('pageerror: '+err.stack));
          const res=await page.goto('https://tilawat-di5.pages.dev/?smoke='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
          console.log('HTTP',res?.status());
          await page.waitForTimeout(12000);
          const state=await page.evaluate(()=>({
            hero:document.querySelector('#heroStats')?.textContent?.trim(),
            shelves:document.querySelector('#homeShelves')?.children?.length,
            gear:!!document.querySelector('#classicSettingsBtn'),
            tabbar:!!document.querySelector('.tabbar'),
            brand:!!document.querySelector('#brand'),
            searchInput:!!document.querySelector('#searchInput'),
            librarySegs:!!document.querySelector('#librarySegs'),
            favoriteHub:!!document.querySelector('#favoriteHub'),
            motionUi:document.documentElement.dataset.motionUi||'',
            gsap:!!window.gsap,
            recoveryCss:[...document.styleSheets].some(s=>(s.href||'').includes('codex-ui-recovery.css')),
            multipartModule:[...document.styleSheets].some(s=>(s.href||'').includes('multipart.css')),
            addSvg:!!document.querySelector('#addBtn b svg'),
            script:[...document.scripts].map(s=>s.src||'inline'),
            body:document.body.innerText.slice(0,800)
          }));
          console.log('STATE',JSON.stringify(state,null,2));
          if(state.gear){
            await page.click('#classicSettingsBtn');
            await page.waitForTimeout(350);
            const settingsOpen=await page.evaluate(()=>document.querySelector('#classicSettings')?.classList.contains('open'));
            console.log('SETTINGS_OPEN',settingsOpen);
            if(!settingsOpen)errors.push('settings panel did not open');
            await page.click('#classicSettingsClose');
          }
          await page.click('#addBtn');
          await page.waitForTimeout(250);
          const multipartReady=await page.evaluate(()=>{
            const part2=document.querySelector('#multipartBuilder [data-part="2"]');
            const part3=document.querySelector('#multipartBuilder [data-part="3"]');
            return !!part2 && !part2.hidden && !!part3 && part3.hidden;
          });
          console.log('MULTIPART_READY',multipartReady);
          if(!multipartReady)errors.push('multipart add flow did not initialize');
          if(errors.length) console.log('ERRORS\n'+errors.join('\n---\n'));
          await browser.close();
          const motionOk=state.motionUi==='gsap'||state.motionUi==='css';
          if(res?.status()!==200 || !state.hero || /جار.*تجهيز/.test(state.hero) || !state.shelves || !state.favoriteHub || !state.multipartModule || state.recoveryCss || !motionOk || !state.addSvg || errors.length) process.exit(1);
          EOF
          node smoke.mjs