name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject known runtime and legacy patch patterns
        run: |
          set -euo pipefail
          matches="$(grep -RFn --include='*.js' 'return$$' tilawat || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo 'Found accidental return$$ token that becomes a runtime ReferenceError.'
            exit 1
          fi
          test ! -e tilawat/js/codex-ui-recovery.js
          test ! -e tilawat/codex-ui-recovery.css
          if grep -Fq "getElementById('.tabbar')" tilawat/js/v2.js tilawat/js/classic-ui.js; then
            echo 'Legacy tabbar selector bridge returned.'
            exit 1
          fi
          if grep -Fq 'tilawatV28EditBackdrop' tilawat/js/interaction-v28.js; then
            echo 'Duplicate v28 edit form returned; editing must use the primary form.'
            exit 1
          fi
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check js/core.js
          node --check js/importer.js
          node --check js/main.js
          node --check js/timeline.js
          node --check tilawat/sw.js
          node --check tilawat/js/app.js
          node --check tilawat/js/store.js
          node --check tilawat/js/player.js
          node --check tilawat/js/sources.js
          node --check tilawat/js/covers.js
          node --check tilawat/js/reorder.js
          node --check tilawat/js/v2.js
          node --check tilawat/js/classic-ui.js
          node --check tilawat/js/interaction-v28.js
          node --check tilawat/js/favorites.js
          node --check tilawat/js/motion-system.js
          node --check tilawat/js/multipart-state.js
          node --check tilawat/js/multipart-ui.js
          node --check tilawat/js/recitation-edit.js
          node --check tilawat/js/library-membership.js
          node --check tilawat/js/app-logic.js
          node --check tilawat/js/catalog/core.js
          node --check tilawat/js/catalog/mp3quran.js
          node --check tilawat/functions/api/resolve-source.js
          node --check tilawat/functions/api/yaldosry-audio.js
          node --check tilawat/tests/browser-regression.mjs
          node --check tilawat/tests/mini-swipe-regression.mjs
          node --check tilawat/tests/multipart-regression.mjs
          node --check tilawat/tests/ux-stability-regression.mjs
          node --check tilawat/tests/visual-audit.mjs
      - name: Run Tilawat behavior tests
        working-directory: tilawat
        run: npm test
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Run Tilawat browser regressions and product audit
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tilawat-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:4173/tilawat/ >/dev/null; then break; fi
            sleep 1
          done
          node tilawat/tests/browser-regression.mjs
          node tilawat/tests/mini-swipe-regression.mjs
          node tilawat/tests/multipart-regression.mjs
          node tilawat/tests/ux-stability-regression.mjs
          node tilawat/tests/visual-audit.mjs
      - name: Upload Tilawat visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tilawat-visual-qa
          path: tilawat/test-artifacts
          if-no-files-found: ignore
      - name: Check HTML and required files
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          for f in ['index.html','runner.html','tilawat/index.html']:
              p=P(); p.feed(Path(f).read_text())
          import json
          for m in ['manifest.webmanifest','tilawat/manifest.webmanifest']:
              json.loads(Path(m).read_text())
          required=['styles.css','manifest.webmanifest','assets/logo.svg','sw.js',
                    'tilawat/styles.css','tilawat/sw.js','tilawat/assets/logo.svg',
                    'tilawat/assets/icon-192.png','tilawat/assets/icon-512.png',
                    'tilawat/js/covers.js','tilawat/js/reorder.js','tilawat/js/app-logic.js',
                    'tilawat/js/interaction-v28.js','tilawat/interaction-v28.css',
                    'tilawat/js/favorites.js','tilawat/favorites.css',
                    'tilawat/js/motion-system.js','tilawat/motion-system.css',
                    'tilawat/js/multipart-state.js','tilawat/js/multipart-ui.js','tilawat/multipart.css',
                    'tilawat/js/recitation-edit.js','tilawat/js/library-membership.js','tilawat/library-membership.css',
                    'tilawat/functions/api/resolve-source.js','tilawat/functions/api/yaldosry-audio.js',
                    'tilawat/assets/covers/default.jpg','tilawat/assets/covers/dossari.jpg',
                    'tilawat/tests/logic.test.mjs','tilawat/tests/backend-source.test.mjs',
                    'tilawat/tests/browser-regression.mjs','tilawat/tests/mini-swipe-regression.mjs',
                    'tilawat/tests/multipart-regression.mjs','tilawat/tests/ux-stability-regression.mjs',
                    'tilawat/tests/visual-audit.mjs','tilawat/package.json']
          missing=[f for f in required if not Path(f).exists()]
          assert not missing, f'Missing: {missing}'
          print('Validation OK')
          PY