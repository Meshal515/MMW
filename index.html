<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ef">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Local — شغّل مشاريع الويب محليًا، حدّثها، وارجع لأي نسخة عبر خط زمني بصري.">
  <title>Local</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Local — الرئيسية">
        <img src="./assets/logo.svg" alt="" width="38" height="38">
        <span>Local</span>
      </a>
      <div class="topbar__actions">
        <button id="themeToggle" class="icon-btn" type="button" aria-label="تغيير المظهر" title="تغيير المظهر">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 15.1A8.8 8.8 0 0 1 8.9 3.7a9 9 0 1 0 11.4 11.4Z"/></svg>
        </button>
        <button id="addProjectTop" class="button button--primary button--small" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>أضف مشروعًا</span>
        </button>
      </div>
    </header>

    <main id="main" class="main"></main>
  </div>

  <dialog id="importDialog" class="modal modal--sheet">
    <form method="dialog" class="modal__panel import-panel" id="importForm">
      <div class="modal__head">
        <div>
          <p class="kicker" id="importKicker">مشروع جديد</p>
          <h2 id="importTitle">أضف مشروعك</h2>
        </div>
        <button class="icon-btn" value="cancel" type="submit" aria-label="إغلاق">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <p class="modal__lede" id="importLede">ضع مشروع الويب كما هو. يدعم ZIP أو مجلدًا كاملًا أو ملف HTML واحدًا.</p>
      <div class="import-options">
        <button class="import-option" type="button" data-import="zip">
          <span class="import-option__icon import-option__icon--text">ZIP</span>
          <strong>ملف ZIP</strong>
          <small>مشروع مضغوط كامل</small>
        </button>
        <button class="import-option" type="button" data-import="folder">
          <span class="import-option__icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7h6l2 2h9v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/></svg>
          </span>
          <strong>مجلد</strong>
          <small>اختر مجلد المشروع</small>
        </button>
        <button class="import-option" type="button" data-import="file">
          <span class="import-option__icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8l4 4V20.5H6zM14 3.5v4h4"/></svg>
          </span>
          <strong>ملف واحد</strong>
          <small>HTML يعمل وحده</small>
        </button>
      </div>
      <div id="dropZone" class="drop-zone" tabindex="0">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>
        <strong>أو اسحب المشروع هنا</strong>
        <span>ZIP أو ملفات المشروع</span>
      </div>
      <input id="zipInput" type="file" accept=".zip,application/zip" hidden>
      <input id="folderInput" type="file" webkitdirectory multiple hidden>
      <input id="singleInput" type="file" accept=".html,.htm,text/html" hidden>
      <div id="importProgress" class="progress" hidden>
        <div class="progress__track"><i id="progressBar"></i></div>
        <span id="progressText">جاري تجهيز المشروع…</span>
      </div>
    </form>
  </dialog>

  <dialog id="menuDialog" class="menu-popover">
    <div class="menu-popover__panel">
      <button type="button" data-menu-action="info">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg>
        <span>كل المعلومات</span>
      </button>
      <button type="button" data-menu-action="timeline">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M7 8v8M12 6v12M17 9v6"/></svg>
        <span>الخط الزمني</span>
      </button>
    </div>
  </dialog>

  <dialog id="infoDialog" class="modal modal--full">
    <section class="modal__panel modal__panel--page">
      <header class="page-head">
        <button class="icon-btn" data-close="infoDialog" type="button" aria-label="رجوع">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
        </button>
        <div>
          <p class="kicker">المشروع</p>
          <h2 id="infoTitle">كل المعلومات</h2>
        </div>
      </header>
      <div id="infoContent" class="info-content"></div>
    </section>
  </dialog>

  <dialog id="timelineDialog" class="modal modal--full timeline-modal">
    <section class="modal__panel modal__panel--page timeline-page">
      <header class="page-head timeline-head">
        <button class="icon-btn" data-close="timelineDialog" type="button" aria-label="رجوع">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
        </button>
        <div>
          <p class="kicker">تاريخ المشروع</p>
          <h2 id="timelineTitle">الخط الزمني</h2>
        </div>
        <div class="timeline-tools">
          <button id="zoomOut" class="icon-btn" type="button" aria-label="تصغير">−</button>
          <button id="resetTimeline" class="icon-btn" type="button" aria-label="إعادة التمركز">⌾</button>
          <button id="zoomIn" class="icon-btn" type="button" aria-label="تكبير">+</button>
        </div>
      </header>
      <div id="timelineViewport" class="timeline-viewport">
        <div id="timelineStage" class="timeline-stage"></div>
        <div class="timeline-help">اسحب الأرضية للتنقل · قرّب أو بعّد بإصبعين</div>
      </div>
      <aside id="versionPanel" class="version-panel" hidden></aside>
    </section>
  </dialog>

  <dialog id="previewDialog" class="preview-dialog">
    <div class="preview-shell">
      <header class="preview-bar">
        <button id="closePreview" class="icon-btn" type="button" aria-label="إغلاق المعاينة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <div class="preview-bar__title">
          <strong id="previewTitle">المشروع</strong>
          <small id="previewVersion">النسخة 1</small>
        </div>
        <div class="preview-bar__actions">
          <button id="reloadPreview" class="icon-btn" type="button" aria-label="إعادة تحميل">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M19 11a7 7 0 1 0 .2 4"/></svg>
          </button>
          <button id="openPreviewTab" class="icon-btn" type="button" aria-label="فتح في تبويب">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M18 13v6H5V6h6"/></svg>
          </button>
        </div>
      </header>
      <iframe id="previewFrame" title="معاينة المشروع" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
      <section id="consoleTray" class="console-tray" aria-label="الكونسول">
        <button id="consoleToggle" class="console-tray__toggle" type="button">
          <span>الكونسول</span><b id="consoleCount">0</b>
        </button>
        <div id="consoleBody" class="console-tray__body"></div>
      </section>
    </div>
  </dialog>

  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <script src="./app.js" type="module"></script>
</body>
</html>
