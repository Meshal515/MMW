name: Deploy Tilawat Catalog Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-tilawat-catalog.yml"

concurrency:
  group: tilawat-catalog-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker source
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/parse.js
      - name: Ensure D1 database exists
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(npx --yes wrangler@latest d1 list --json)"
          DB_ID="$(printf '%s' "$LIST" | jq -r '.[] | select(.name=="tilawat-catalog") | (.uuid // .id)' | head -n1)"
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            npx --yes wrangler@latest d1 create tilawat-catalog >/tmp/d1-create.txt
            LIST="$(npx --yes wrangler@latest d1 list --json)"
            DB_ID="$(printf '%s' "$LIST" | jq -r '.[] | select(.name=="tilawat-catalog") | (.uuid // .id)' | head -n1)"
          fi
          test -n "$DB_ID"
          echo "TILAWAT_D1_ID=$DB_ID" >> "$GITHUB_ENV"
      - name: Generate deploy config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const cfg={
            name:'tilawat-catalog',
            main:'src/index.js',
            compatibility_date:'2026-09-01',
            workers_dev:true,
            observability:{enabled:true},
            d1_databases:[{binding:'DB',database_name:'tilawat-catalog',database_id:process.env.TILAWAT_D1_ID}]
          };
          fs.writeFileSync('wrangler.deploy.json',JSON.stringify(cfg,null,2));
          NODE
      - name: Apply D1 schema
        run: npx --yes wrangler@latest d1 execute tilawat-catalog --file=./schema.sql --remote --config wrangler.deploy.json
      - name: Deploy Worker
        run: npx --yes wrangler@latest deploy --config wrangler.deploy.json | tee /tmp/tilawat-worker-deploy.txt
      - name: Verify Worker
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN_JSON="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          SUBDOMAIN="$(printf '%s' "$SUBDOMAIN_JSON" | jq -r '.result.subdomain // empty')"
          test -n "$SUBDOMAIN"
          URL="https://tilawat-catalog.${SUBDOMAIN}.workers.dev"
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 20 "$URL/api/health" | jq -e '.ok == true' >/dev/null; then
              echo "Catalog Worker published and verified: $URL"
              exit 0
            fi
            sleep 4
          done
          echo "Worker health check failed: $URL"
          exit 1
