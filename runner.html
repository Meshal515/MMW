<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Local · تشغيل</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#171c1c;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
    body{overflow:hidden}

    /* The project gets the whole screen. Nothing of Local's is painted over it. */
    #root,iframe{display:block;width:100%;height:100%;border:0;background:#fff}

    /* Exit lives on the edge, not on the page: a 6px handle at the vertical
       centre of the left rim, where a site almost never puts anything. It opens
       on hover (mouse) or on a first tap (touch), so nothing exits by accident. */
    .exit{
      position:fixed;z-index:2147483647;
      inset-block-start:50%;inset-inline-start:0;
      transform:translateY(-50%);
      margin-inline-start:env(safe-area-inset-left,0px);
      inline-size:6px;block-size:64px;padding:0;
      border:0;border-start-end-radius:8px;border-end-end-radius:8px;
      background:rgba(23,28,28,.32);
      color:#F0EFEA;cursor:pointer;
      display:grid;place-items:center;overflow:hidden;
      -webkit-tap-highlight-color:transparent;
      transition:inline-size .26s cubic-bezier(.16,1,.3,1),block-size .26s cubic-bezier(.16,1,.3,1),background .26s ease,box-shadow .26s ease;
    }
    .exit::after{
      content:"";position:absolute;inset-inline-start:1.5px;inline-size:3px;block-size:26px;
      border-radius:99px;background:currentColor;opacity:.5;transition:opacity .2s ease;
    }
    .exit svg{inline-size:19px;block-size:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;opacity:0;transition:opacity .18s ease}
    .exit.is-open{
      inline-size:44px;block-size:44px;border-radius:0 14px 14px 0;
      background:rgba(23,28,28,.9);
      box-shadow:0 6px 22px rgba(0,0,0,.4);
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    }
    .exit.is-open::after{opacity:0}
    .exit.is-open svg{opacity:1}
    .exit:focus-visible{outline:2px solid #86A37C;outline-offset:3px}

    /* Says what is running, then gets out of the way. */
    .flash{
      position:fixed;z-index:2147483646;inset-block-end:calc(18px + env(safe-area-inset-bottom,0px));
      inset-inline-start:50%;transform:translateX(-50%);
      max-inline-size:min(86vw,420px);
      padding:9px 15px;border-radius:999px;
      background:rgba(23,28,28,.92);color:#F0EFEA;
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
      font-size:13px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      box-shadow:0 8px 26px rgba(0,0,0,.34);pointer-events:none;
      opacity:0;animation:flash 3.4s cubic-bezier(.16,1,.3,1) forwards;
    }
    .flash kbd{font:inherit;opacity:.72}
    @keyframes flash{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}72%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,6px)}}

    .error{height:100%;display:grid;place-items:center;color:#F0EFEA;background:#171c1c;text-align:center;padding:30px}
    .error h2{margin:0 0 8px;font-size:20px}
    .error p{color:#A8AEAA;margin:0 0 20px;line-height:1.7}
    .error a{color:#86A37C}
    @media (prefers-reduced-motion:reduce){
      .exit{transition-duration:.01ms}
      .flash{animation-duration:.01ms;animation-delay:3s;opacity:1}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <button class="exit" id="exit" type="button" aria-label="خروج من المشروع (Esc)" title="خروج (Esc)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
  </button>

  <script>
    const DB='local-launcher-v1';
    const open=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    const get=(db,store,key)=>new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    const params=new URLSearchParams(location.search), vid=params.get('version'), pid=params.get('project');
    const exitBtn=document.getElementById('exit');

    function leave(){ if(history.length>1) history.back(); else location.href='./'; }

    /* Two stages on touch, one on a mouse: the handle has to be open before the
       click counts, so a stray thumb on the screen edge never drops the project. */
    let openTimer=null;
    const setOpen=on=>{
      exitBtn.classList.toggle('is-open',on);
      clearTimeout(openTimer);
      if(on) openTimer=setTimeout(()=>exitBtn.classList.remove('is-open'),2600);
    };
    const finePointer=matchMedia('(hover:hover) and (pointer:fine)').matches;
    exitBtn.addEventListener('pointerenter',()=>{ if(finePointer) setOpen(true); });
    exitBtn.addEventListener('pointerleave',()=>{ if(finePointer) setOpen(false); });
    exitBtn.addEventListener('focus',()=>setOpen(true));
    exitBtn.addEventListener('blur',()=>setOpen(false));
    exitBtn.addEventListener('click',()=>{ exitBtn.classList.contains('is-open') ? leave() : setOpen(true); });

    /* Escape works wherever the focus is — including inside the project, which is
       same-origin here, so the listener can be attached to its document too. */
    const onKey=e=>{ if(e.key==='Escape'){ e.preventDefault(); leave(); } };
    addEventListener('keydown',onKey);

    (async()=>{
      const root=document.getElementById('root');
      try{
        const db=await open();
        const [p,v]=await Promise.all([get(db,'projects',pid),get(db,'versions',vid)]);
        if(!p||!v) throw new Error('missing');
        document.title=`${p.title} · Local`;
        const f=document.createElement('iframe');
        f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen; camera; microphone; geolocation');
        f.setAttribute('title',p.title);
        f.src=`./__local__/${encodeURIComponent(pid)}/${encodeURIComponent(vid)}/${String(v.entry).split('/').map(encodeURIComponent).join('/')}`;
        f.addEventListener('load',()=>{
          try{ f.contentDocument?.addEventListener('keydown',onKey); }catch{}
        });
        root.appendChild(f);

        const flash=document.createElement('div');
        flash.className='flash';
        const name=document.createElement('span'); name.textContent=p.title;
        flash.appendChild(name);
        flash.insertAdjacentHTML('beforeend', finePointer
          ? ' — <kbd>Esc</kbd> للخروج'
          : ' — المقبض على حافة الشاشة للخروج');
        document.body.appendChild(flash);
        flash.addEventListener('animationend',()=>flash.remove());
      }catch(e){
        exitBtn.hidden=true;
        root.innerHTML='<div class="error"><div><h2>تعذر تشغيل هذه النسخة</h2><p>الملفات المحفوظة لهذه النسخة غير مكتملة.<br>ارجع إلى Local واستورد المشروع من جديد.</p><a href="./">رجوع إلى Local</a></div></div>';
      }
    })();
  </script>
</body>
</html>
